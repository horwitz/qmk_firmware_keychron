name: horwitz keymap

permissions:
  contents: read

on:
  push:
    branches:
      - bluetooth_playground
      - wireless_playground
    paths:
      - 'keyboards/keychron/k3_pro/ansi/rgb/keymaps/horwitz/**'
      - 'keyboards/keychron/k3_max/ansi/rgb/keymaps/horwitz/**'
      - 'users/horwitz/**'
      - 'tests/horwitz/**'
      - 'tests/test_common/**'
      - 'builddefs/**'
      - 'quantum/**'
      - 'platforms/**'
      - 'tmk_core/**'
      - '*.mk'
      - 'Makefile'
      - '.github/workflows/horwitz.yml'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Install dependencies
        run: pip3 install -r requirements-dev.txt
      - name: Run horwitz unit tests
        run: make test:horwitz

  build-pro:
    name: Firmware build (K3 Pro)
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Install dependencies
        run: pip3 install -r requirements-dev.txt
      - name: Build horwitz keymap
        run: make keychron/k3_pro/ansi/rgb:horwitz

  build-max:
    name: Firmware build (K3 Max)
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Install dependencies
        run: pip3 install -r requirements-dev.txt
      - name: Build horwitz keymap
        run: make keychron/k3_max/ansi/rgb:horwitz
