name: horwitz keymap

permissions:
  contents: read

on:
  push:
    branches:
      - bluetooth_playground
    paths:
      - 'keyboards/keychron/k3_pro/ansi/rgb/keymaps/horwitz/**'
      - 'tests/horwitz/**'
      - 'builddefs/**'
      - 'quantum/**'
      - 'platforms/**'
      - 'tmk_core/**'
      - '*.mk'
      - 'Makefile'
      - '.github/workflows/horwitz.yml'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install dependencies
        run: pip3 install -r requirements-dev.txt
      - name: Run horwitz unit tests
        run: make test:horwitz
