name: horwitz keymap (X4)

# Builds the horwitz keymap for the Lemokey X4. (The fork's keymap for the Keychron K3 has its own workflow file with a
# different name, so the two never collide when the branches are merged.)
#
# Triggers: every push to x4 (no path filter, so a change anywhere that could break the build is never missed), every
# pull request, and a manual run from the Actions tab.
#
# It also runs `qmk lint` on the keymap, after the build so that a lint failure never hides a build result, checks that
# the public-facing files (the keymap folder and this file) contain no internal identifiers, and keeps the built firmware
# as a downloadable artifact.

permissions:
  contents: read

on:
  push:
    branches:
      - x4
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Firmware build (Lemokey X4)
    # Pinned like the container below: `ubuntu-latest` is a floating label (GitHub is moving it to Ubuntu 26), and the first
    # run on 2026-11-11 used the ubuntu-24.04 image.
    runs-on: ubuntu-24.04
    # Pinned to a version tag, not `latest`, so CI does not change under us. As of 2026-11-10, 1.2.0 was the same image
    # as `latest` (sha256:b7d7fa8fb4432b56...): GCC 15.2.0 and qmk 1.2.0, the same as the local QMK MSYS, and it builds a
    # byte-identical firmware. To move to a newer image, change the tag, rebuild locally in the container and compare it
    # with a local QMK MSYS build, then record the new versions in the project's notes.
    container: qmkfm/qmk_cli:1.2.0

    steps:
      # `qmk lint` runs git inside the container, whose checkout is owned by another user; as in QMK's own lint.yml, tell
      # git that is fine.
      - name: Disable safe.directory check
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      # Public-facing text must stand on its own: no task numbers, no pointers to the project's two internal notes files, no
      # personal wording, no names from the fork's other keymap's branch. Each pattern has one letter in square brackets so
      # that this very step does not match itself. Matching is case-insensitive.
      - name: Check public-facing text for internal identifiers
        run: |
          if grep -rniE '[t]ask [0-9]|claude[.]md|tasks[.]md|\b[o]wner\b|wireless_[p]layground|users/[h]orwitz' keyboards/keychron/x4/ansi_encoder/red/keymaps/horwitz .github/workflows/horwitz_x4.yml; then
            echo "::error::Internal identifiers found in public-facing files (see the lines above)"
            exit 1
          fi
      - name: Install dependencies
        run: pip3 install -r requirements-dev.txt
      - name: Build horwitz keymap
        run: make keychron/x4/ansi_encoder/red:horwitz
      # The built firmware is kept as a workflow artifact, so that the image of any commit can be downloaded and flashed from
      # another computer. Its size and SHA-256 go to the job log and the run's summary page, to check a download against.
      - name: Record the firmware's size and SHA-256
        run: |
          f=keychron_x4_ansi_encoder_red_horwitz.bin
          sha256sum "$f"
          {
            echo "### Firmware"
            echo
            echo "| File | Bytes | SHA-256 |"
            echo "|---|---|---|"
            echo "| $f | $(stat -c %s "$f") | $(sha256sum "$f" | cut -d' ' -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
      # Pinned to an exact version like the other actions; retention is 30 days, not the 90-day default.
      - name: Upload the firmware
        uses: actions/upload-artifact@v7.0.2
        with:
          name: horwitz-x4-firmware
          path: keychron_x4_ansi_encoder_red_horwitz.bin
          if-no-files-found: error
          retention-days: 30
      - name: Lint horwitz keymap
        run: qmk lint -kb keychron/x4/ansi_encoder/red -km horwitz
